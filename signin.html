<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Kageyo-tss-elearning</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-100 to-blue-300 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-xl rounded-2xl w-full max-w-md p-6">
    
    <!-- LOGO -->
    <div class="flex justify-center mb-4">
      <img src="download.png" alt="Kageyo Learning center" class="h-16 w-auto" />
      <!-- Replace 'logo.png' with your actual logo file path -->
    </div>

    <h1 class="text-3xl font-bold text-center text-blue-700 mb-6">Sign In to Clever Clone</h1>

    <!-- Sign In Form -->
    <form action="dashboard.html" method="GET">
      <div class="mb-4">
        <label class="block text-gray-700 mb-1" for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Email address"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
          required
        />
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 mb-1" for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Password"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
          required
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition"
      >
        Sign In
      </button>

      <p class="text-sm text-center text-gray-500 mt-4">
        Don’t have an account? <a href="signup.html" class="text-blue-600 underline">Sign Up</a>
      </p>
    </form>
  </div>

</body>
</html>
